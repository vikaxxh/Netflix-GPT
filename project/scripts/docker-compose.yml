version: '3.8'

services:
  nginx_lb:
    image: nginx:latest
    container_name: nginx_lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx:/etc/nginx/conf.d:ro
    networks:
      - default

  app_blue:
    build: .
    container_name: app_blue
    environment:
      - APP_COLOR=blue
      - APP_VERSION=1.0.0
    networks:
      - default

  # Initially, app_green is not strictly needed as it will be deployed by the pipeline,
  # but we can declare it here for completeness or local testing without Jenkins.
  app_green:
    build: .
    container_name: app_green
    environment:
      - APP_COLOR=green
      - APP_VERSION=1.0.0
    networks:
      - default
      
networks:
  default:
    name: netflix_default
